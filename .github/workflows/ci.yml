# הרצה: שורש המאגר = תיקיית smart-building-os (או העתיקו ל-workflow בשורש מונוריפו והגדירו defaults.run.working-directory)
# Actions pinned to @v5 (released Q4-2025) — runs on Node 24 internally,
# resolving the Node 20 deprecation warning that GitHub surfaced for older runners.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Importer fixtures dry-run
        run: npm run dry-run:imports

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # ערכי placeholder — החליפו ב-GitHub Secrets אם הבילד נכשל (Supabase / Gemini)
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-build-only
          GEMINI_API_KEY: ""
